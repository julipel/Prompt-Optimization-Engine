[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-optimization-engine"
version = "0.1.0"
description = "Provider-independent prompt evaluation and optimization engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["dspy==3.4.0", "gepa==0.1.4", "fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
prompt-opt = "prompt_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = ["gepa_smoke: optional real-provider GEPA integration test"]
